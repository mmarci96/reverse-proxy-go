# File watching
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/app ./cmd/main.go"
bin = "tmp/app"
full_bin = "APP_ENV=dev ./tmp/app"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["vendor", "node_modules", "tmp", "frontend"]
exclude_file = ["*_test.go"]
delay = 1000 # in milliseconds

[log]
time = true

[colors]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"

[misc]
# Delete tmp directory on exit
clean_on_exit = true
